<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>SINLUX 客户管理</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%236FA287'/%3E%3Cpath d='M9 21c0-7 5-11 14-12-1 8-5 13-12 13z' fill='%23FFFDF8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fonts/wenkai.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <img class="logo-full" src="/api/settings/quote/logo" alt="SINLUX">
      <svg class="logo mini" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#6FA287"/><path d="M9 21c0-7 5-11 14-12-1 8-5 13-12 13z" fill="#FFFDF8"/><path d="M10 23c3-4 6-7 10-9" stroke="#6FA287" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      <small class="sub">客户管理系统</small>
    </div>
    <nav id="nav">
      <a href="#dashboard" data-v="dashboard"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span>数据看板</span></a>
      <div class="nav-title">客户</div>
      <a href="#list" data-v="list"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>客户列表</span></a>
      <a href="#add" data-v="add"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg><span>录入客户</span></a>
      <a href="#reminders" data-v="reminders"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span>跟进提醒</span><i id="remBadge"></i></a>
      <div class="nav-title">销售</div>
      <a href="#quotes" data-v="quotes"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="14" y2="17"/></svg><span>报价单</span></a>
      <div class="nav-title">产品</div>
      <a href="#products" data-v="products"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><polyline points="3.3 7.5 12 12.5 20.7 7.5"/><line x1="12" y1="22" x2="12" y2="12.5"/></svg><span>产品库</span></a>
      <a href="#vendors" data-v="vendors"><svg viewBox="0 0 24 24"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/><line x1="9" y1="10" x2="9.01" y2="10"/><line x1="15" y1="10" x2="15.01" y2="10"/></svg><span>供应商</span></a>
      <div class="nav-title">工具</div>
      <a href="#import" data-v="import"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>导入客户</span></a>
      <a href="#pimport" data-v="pimport"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>导入产品</span></a>
      <a href="#piimport" data-v="piimport"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>导入 PI</span></a>
      <a href="#settings" data-v="settings"><svg viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span>设置</span></a>
    </nav>
    <svg class="hills" viewBox="0 0 240 90" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 60 Q40 30 90 52 T180 44 T240 56 V90 H0z" fill="#CFE3D2"/>
      <path d="M0 74 Q50 50 110 68 T240 66 V90 H0z" fill="#B7D4BF"/>
      <ellipse cx="190" cy="18" rx="22" ry="8" fill="#fff" opacity=".85"/><ellipse cx="172" cy="22" rx="14" ry="6" fill="#fff" opacity=".85"/>
    </svg>
  </aside>
  <div class="content">
    <header class="topbar">
      <h1 id="pageTitle">客户列表</h1>
      <label class="gsearch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="gSearch" placeholder="搜索客户：公司 / 联系人 / 邮箱 / 备注，回车查看" autocomplete="off"></label>
      <a class="btn-new" href="#add">＋ 录入客户</a>
    </header>
    <main id="app"></main>
  </div>
</div>
<div id="modal"><div class="inner" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
